<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#17110c">
<title>Paradise Kitchen | Menu</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #17110c; color: #fff8e8; font-family: Arial, sans-serif; }
  header { text-align: center; padding: 26px 16px 20px; background: linear-gradient(135deg,#1c130d,#5b1d16); border-bottom: 3px solid #d7a83c; }
  h1 { margin: 0; color: #f7cb54; font-size: clamp(28px,5vw,44px); letter-spacing: 1px; }
  header p { margin: 8px 0 0; font-size: 15px; }
  nav { display:flex; justify-content:center; flex-wrap:wrap; gap:10px; padding:16px; position:sticky; top:0; background:#17110cf2; z-index:5; }
  nav a { text-decoration:none; color:#17110c; background:#f7cb54; padding:11px 17px; border-radius:24px; font-weight:bold; }
  main { max-width: 980px; margin: 0 auto; padding: 10px 12px 32px; }
  section { scroll-margin-top: 80px; margin: 16px auto 28px; }
  h2 { color:#f7cb54; text-align:center; margin: 10px 0 14px; }
  img { display:block; width:100%; height:auto; border-radius:10px; box-shadow:0 8px 28px #0008; }
  .contact { text-align:center; padding:20px 12px 26px; background:#35150f; border-top:2px solid #d7a83c; line-height:1.8; }
  .contact a { color:#f7cb54; font-weight:bold; }
  footer { text-align:center; color:#d7c7a9; padding:12px; font-size:12px; }
</style>
</head>
<body>
<header>
  <h1>Paradise Kitchen</h1>
  <p>Good Food • Great Mood ❤️</p>
  <p>Scan • Browse Menu • Call to Order</p>
</header>
<nav>
  <a href="#combo">Combo Thali Menu</a>
  <a href="#fullmenu">Full Food Menu</a>
</nav>
<main>
  <section id="combo">
    <h2>Combo Thali Menu</h2>
    <img src="menu1.jpeg" alt="Paradise Combo Thali menu">
  </section>
  <section id="fullmenu">
    <h2>Full Food Menu</h2>
    <img src="menu2.jpeg" alt="Paradise Kitchen full menu">
  </section>
</main>
<div class="contact">
  <strong>Contact / Order</strong><br>
  <a href="tel:7735100232">7735100232</a> &nbsp; | &nbsp;
  <a href="tel:8917300232">8917300232</a>
</div>
<footer>Paradise Kitchen • Menu and prices may change</footer>
</body>
</html>
